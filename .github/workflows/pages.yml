name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Pages (GitHub Actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1
          EXISTS=$?
          set -e
          if [ "$EXISTS" -ne 0 ]; then
            echo "Creating Pages site with build_type=workflow…"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
              echo "::error::Pages nejsou zapnuté. Jednou otevři: https://github.com/${GITHUB_REPOSITORY}/settings/pages → Source: GitHub Actions → Save. Pak znovu spusť tento workflow (Re-run)."
              exit 1
            fi
          else
            echo "Pages už existují — nastavuji build_type=workflow"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true
          fi

      - name: Verify docs/
        run: |
          set -euo pipefail
          python3 scripts/verify-pages.py
          if git ls-files | grep -E 'ops-redakce|aktuality-config\.js|aktuality-admin\.js|assets/js/vendor/'; then
            echo "Editor/secret paths must not be tracked" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
