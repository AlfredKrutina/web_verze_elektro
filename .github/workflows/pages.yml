name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages payload
        run: |
          set -euo pipefail
          python3 scripts/verify-pages.py
          # Editor / secrets must not be tracked (may exist locally via gitignore)
          if git ls-files | grep -E 'ops-redakce|aktuality-config\.js|aktuality-admin\.js|assets/js/vendor/'; then
            echo "Editor/secret paths must not be tracked" >&2
            exit 1
          fi
          echo "Verify OK"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
