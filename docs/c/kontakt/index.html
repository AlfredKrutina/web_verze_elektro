<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakt | Elektro Euron — Design C</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="icon" href="../assets/media/mark.svg" type="image/svg+xml" />
  </head>
  <body data-root=".." data-page="kontakt">
    <div data-header></div>
    <main id="main" class="container">
      <header class="page-hero reveal">
        <h1>Kontakt</h1>
        <p>Poptávka řešení nebo přímé volání — ozveme se co nejdřív.</p>
      </header>
      <div class="contact-layout reveal" style="margin-bottom:4rem">
        <form class="form-card" data-inquiry-form>
          <label for="typ">Typ poptávky</label>
          <select id="typ" name="typ">
            <option>Montáž</option><option>FVE</option><option>Projekce</option><option>Revize</option>
            <option>Rozvaděče</option><option>Slaboproud</option><option>Obchod</option><option>Jiné</option>
          </select>
          <label for="jmeno">Jméno a firma</label>
          <input id="jmeno" name="jmeno" required />
          <label for="telefon">Telefon</label>
          <input id="telefon" name="telefon" type="tel" required />
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" />
          <label for="lokalita">Lokalita</label>
          <input id="lokalita" name="lokalita" />
          <label for="zprava">Zpráva</label>
          <textarea id="zprava" name="zprava" required></textarea>
          <div class="btn-group" style="margin-top:1.2rem">
            <button class="btn btn-primary" type="submit">Odeslat poptávku</button>
            <a class="btn btn-ghost" href="tel:+420354437476">Zavolat</a>
          </div>
        </form>
        <aside>
          <h2 style="font-family:var(--display)">Sídlo Cheb</h2>
          <p style="color:var(--muted)">Zelená 1844/6<br><a href="tel:+420354437476">+420 354 437 476</a><br>
          <a href="mailto:info@elektro-euron.cz">info@elektro-euron.cz</a></p>
          <h2 style="font-family:var(--display);margin-top:2rem">Aš</h2>
          <p style="color:var(--muted)">Hlavní 1066/37<br><a href="tel:+420354525284">+420 354 525 284</a></p>
        </aside>
      </div>
    </main>
    <div data-footer></div>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
